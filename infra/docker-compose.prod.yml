# ContractIQ all-in-one stack for any Linux server (or Docker Desktop): database, API, website,
# and optional HTTPS. Optional: the default deployment is Vercel + Render (DEPLOYMENT_GUIDE.md).
#   cp infra/.env.prod.example infra/.env.prod      (fill it in)
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
# With HTTPS (a domain pointing at this server), or let infra/deploy.sh do everything:
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod --profile https up -d --build
name: contractiq

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nyayasim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env.prod}
      POSTGRES_DB: nyayasim
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyayasim"]
      interval: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: contractiq-api:latest
    restart: unless-stopped
    environment:
      NYAYASIM_DATABASE_URL: postgresql+psycopg://nyayasim:${POSTGRES_PASSWORD}@postgres:5432/nyayasim?connect_timeout=10
      NYAYASIM_CORS_ORIGINS: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL}
      NYAYASIM_PUBLIC_URL: ${PUBLIC_WEB_URL}
      NYAYASIM_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NYAYASIM_SITE_PASSWORD: ${SITE_PASSWORD:-}
      NYAYASIM_ALLOW_DEMO_CASES: ${ALLOW_DEMO_CASES:-false}
      NYAYASIM_PRIVATE_LLM_OK: ${NYAYASIM_PRIVATE_LLM_OK:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NYAYASIM_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NYAYASIM_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NYAYASIM_SMTP_HOST: ${SMTP_HOST:-}
      NYAYASIM_SMTP_PORT: ${SMTP_PORT:-587}
      NYAYASIM_SMTP_USER: ${SMTP_USER:-}
      NYAYASIM_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NYAYASIM_SMTP_FROM: ${SMTP_FROM:-ContractIQ <no-reply@localhost>}
    volumes:
      - appdata:/srv/data
    depends_on:
      postgres:
        condition: service_healthy
    # Bound to this machine only: visitors reach the API through the website or Caddy.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"

  web:
    build:
      context: ../frontend
      args:
        API_URL: http://api:8000
    image: contractiq-web:latest
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      SITE_PASSWORD: ${SITE_PASSWORD:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"

  # HTTPS front door: automatic certificates, website and API on one address.
  caddy:
    image: caddy:2.10-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - api

volumes:
  pgdata:
  appdata:
  caddydata:
